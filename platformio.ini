; RFAV-3 POC player — M5Stack Tab5 (ESP32-P4)
; Plays /avatar/make_sandwich.rfav (RFAV rev3) from the SD card at the file's fps.
; Stack cloned from the proven skytab project:
;   pioarduino 54.03.21 + M5Unified + M5GFX (s31a DSI double-buffer patch in libdeps).
; See src/main.cpp header for the render pipeline.

[env:esp32p4_pioarduino]
platform = https://github.com/pioarduino/platform-espressif32.git #54.03.21
upload_speed = 1500000
monitor_speed = 115200
build_type = debug
framework = arduino
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
; board's default_16MB.csv is NOT picked up by the pioarduino builder (it falls
; back to default.csv = 1.25 MB app, too small). 16 MB flash -> 3 MB app slot:
board_build.partitions = app3M_fat9M_16MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  ; Level 2 keeps E/W + app Serial output (level 5 floods the CDC path and
  ; triggers the P4 hw_cdc store-fault — skytab s26 lesson).
  -DCORE_DEBUG_LEVEL=2
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  ; S110: opus audio — vendored libopus public headers for the app build
  -IC:/workspace/m5stackTab5/rfab/lib/opus/src/include
lib_deps =
  https://github.com/M5Stack/M5Unified.git
  https://github.com/M5Stack/M5GFX.git
  ; S110: vendored libopus v1.4 (decode-only) — forced into the build
  lib/opus
  ; S122: data-file FSM — parse /avatars/<model>/avatar.json (v7, header-only)
  bblanchon/ArduinoJson@^7.4.0
; S136 (Q-B): trim the WiFi buffer pools — the always-on wifi stack on the C6 co-processor
; holds ~18 KB of INTERNAL SRAM (the SD driver's bounce alloc then fails with the 21 KB
; largest-block ceiling -> 100% SD starvation -> frozen playback). Values below are the
; reductions vs the framework sdkconfig (C:\Users\scott\.platformio\packages
; \framework-arduinoespressif32-libs\esp32p4\sdkconfig: 10/32/32/32). custom_sdkconfig
; forces a one-time recompile of the IDF+Arduino core libs from source (10-30 min first build).
; S139 (Q-M/B1): second trim pass 6/16/16/16 -> 4/8/8/8 (~30 KB+ more internal headroom
; at wifi init, when the esp_hosted streaming rx pre-alloc + SDMMC bounce allocs happen).
; Wifi has never connected (Q-F), so these pools are pure overhead for now.
custom_sdkconfig =
    CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=4
    CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=8
    CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=8
    CONFIG_ESP_WIFI_MGMT_SBUF_NUM=8
; S141 (Q-M wipe fix): opt out of the platform's managed-components overwrite.
; espidf.py L75 used to hard-set IDF_COMPONENT_OVERWRITE_MANAGED_COMPONENTS=1,
; which made the component manager re-download every managed component from the
; registry on each outer-pass CMake configure -> local esp_hosted Q-M edits
; (sdio_drv.c halve-and-retry, transport_drv.c init-evt log) wiped pre-compile.
; With 0 the manager keeps local files as long as the pinned version's hash
; matches the .component_hash file (see idf_component.yml pin ==2.13.1).
IDF_COMPONENT_OVERWRITE_MANAGED_COMPONENTS = 0
